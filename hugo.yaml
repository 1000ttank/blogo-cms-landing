baseURL: /
languageCode: zh-cn
title: Blogo CMS

defaultContentLanguage: zh-cn
languages:
  zh-cn:
    languageCode: zh-cn
    title: Blogo CMS

theme: hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: 快速开始
      pageRef: /get-started
      weight: 1
    - name: 部署 Hexo 博客
      pageRef: /deploy-blog
      weight: 2
    - identifier: deploy-cms
      name: 部署 CMS
      weight: 3
    - name: 本地部署
      pageRef: /deploy-cms-local
      parent: deploy-cms
      weight: 1
    - name: Github Pages 部署
      pageRef: /deploy-cms-github-pages
      parent: deploy-cms
      weight: 2
    - name: Docker 部署
      pageRef: /deploy-cms-docker
      parent: deploy-cms
      weight: 3
    - name: 常见问题
      pageRef: /faq
      weight: 4
    - name: GitHub
      url: "https://github.com/1000ttank/blog-cms"
      weight: 5
      params:
        icon: github
    - name: Search
      weight: 6
      params:
        type: search
    - name: Theme
      weight: 7
      params:
        type: theme-toggle
        label: true

params:
  theme:
    default: dark
    displayToggle: true
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: true
    displayPoweredBy: false
  page:
    width: wide
  editURL:
    enable: false
