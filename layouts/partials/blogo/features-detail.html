{{/* 功能详情：每个部分单独，下方示例图片，支持 light/dark 主题切换 */}}
<section class="blogo-feature-item blogo-feature-item-animate">
  <div class="blogo-feature-item-content container">
    <h3 class="blogo-feature-block-title">{{ T "blogo_feature_editor" }}</h3>
    <p class="blogo-feature-block-subtitle">{{ T "blogo_feature_editor_subtitle" }}</p>
    <p class="blogo-feature-block-desc">{{ T "blogo_feature_editor_desc" }}</p>
  </div>
  <div class="blogo-feature-item-image">
    <img src="/images/feature-editor-light.png" alt="Markdown 编辑器" class="blogo-img-light">
    <img src="/images/feature-editor-dark.png" alt="Markdown 编辑器" class="blogo-img-dark">
  </div>
</section>

<section class="blogo-feature-item blogo-feature-item-animate">
  <div class="blogo-feature-item-content container">
    <h3 class="blogo-feature-block-title">{{ T "blogo_feature_theme" }}</h3>
    <p class="blogo-feature-block-subtitle">{{ T "blogo_feature_theme_subtitle" }}</p>
    <p class="blogo-feature-block-desc">{{ T "blogo_feature_theme_desc" }}</p>
  </div>
  <div class="blogo-feature-item-image">
    <img src="/images/feature-theme-light.png" alt="多主题管理" class="blogo-img-light">
    <img src="/images/feature-theme-dark.png" alt="多主题管理" class="blogo-img-dark">
  </div>
</section>
